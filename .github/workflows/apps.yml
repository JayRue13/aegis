# Builds the desktop and Android apps on demand (Actions tab -> Apps -> Run workflow).
# Manual only, so it never uses CI minutes by accident. Windows runners count
# double against the free minutes, so pick only the targets you need.
name: Apps

on:
  workflow_dispatch:
    inputs:
      aegis_url:
        description: "Your AEGIS address for the Android app (https://...)"
        required: false
      windows:
        description: "Build the Windows installer"
        type: boolean
        default: true
      linux:
        description: "Build the Linux packages"
        type: boolean
        default: false
      android:
        description: "Build the Android APK (needs aegis_url)"
        type: boolean
        default: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            enabled: ${{ inputs.windows }}
          - os: ubuntu-22.04
            enabled: ${{ inputs.linux }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.enabled
      - uses: actions/setup-node@v4
        if: matrix.enabled
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.enabled
      - name: Linux build dependencies
        if: matrix.enabled && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build
        if: matrix.enabled
        working-directory: desktop
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        if: matrix.enabled
        with:
          name: aegis-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  android:
    if: inputs.android && inputs.aegis_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        working-directory: mobile
        env:
          AEGIS_URL: ${{ inputs.aegis_url }}
        run: |
          npm ci
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-android
          path: mobile/android/app/build/outputs/apk/debug/*.apk
